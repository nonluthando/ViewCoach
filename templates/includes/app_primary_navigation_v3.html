{% with namespace=request.resolver_match.namespace url_name=request.resolver_match.url_name %}
<nav class="app-navigation app-navigation-v3" aria-label="Primary navigation">
    <a class="app-nav-link {% if url_name == 'dashboard' %}is-active{% endif %}"
       href="{% url 'dashboard' %}">
        <span class="app-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"></path><path d="M6 10v10h12V10"></path></svg>
        </span>
        <span>Dashboard</span>
    </a>
    <a class="app-nav-link {% if namespace == 'planner' %}is-active{% endif %}"
       href="{% url 'planner:today' %}">
        <span class="app-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M7 10h10M8 14h3M13 14h3"></path></svg>
        </span>
        <span>Daily Plan</span>
    </a>
    <a class="app-nav-link {% if url_name == 'learn' or namespace == 'roadmaps' %}is-active{% endif %}"
       href="{% url 'learn' %}">
        <span class="app-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5z"></path><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z"></path></svg>
        </span>
        <span>Roadmaps</span>
    </a>
    <a class="app-nav-link {% if namespace == 'reviews' %}is-active{% endif %}"
       href="{% url 'reviews:queue' %}">
        <span class="app-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7"></path><path d="M4 4v5h5M12 8v4l3 2"></path></svg>
        </span>
        <span>Reviews</span>
    </a>
    <a class="app-nav-link {% if url_name == 'interview' or namespace == 'interviews' or namespace == 'goals' or url_name == 'interview_pack' or url_name == 'general_interview_playbook' %}is-active{% endif %}"
       href="{% url 'interview' %}">
        <span class="app-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 5h16v12H7l-3 3z"></path><path d="M8 9h8M8 13h5"></path></svg>
        </span>
        <span>Interview Hub</span>
    </a>
    <a class="app-nav-link {% if namespace == 'evidence' and url_name != 'interview_pack' and url_name != 'general_interview_playbook' %}is-active{% endif %}"
       href="{% url 'evidence:list' %}">
        <span class="app-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="2"></rect><path d="M9 6V4h6v2M8 11h8M8 15h5"></path></svg>
        </span>
        <span>Evidence Bag</span>
    </a>
    <a class="app-nav-link {% if url_name == 'prepare' or namespace == 'questions' or namespace == 'knowledge' %}is-active{% endif %}"
       href="{% url 'prepare' %}">
        <span class="app-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"></path><path d="M8 8h8M8 12h6M8 16h4"></path></svg>
        </span>
        <span>Resources</span>
    </a>
    <a class="app-nav-link {% if url_name == 'need_type_preferences' %}is-active{% endif %}"
       href="{% url 'need_type_preferences' %}">
        <span class="app-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A7 7 0 0 0 15 6l-.3-2.6h-4L10.4 6A7 7 0 0 0 8.5 7L6.1 6 4 9.5 6 11a7 7 0 0 0 0 2l-2 1.5L6.1 18l2.4-1a7 7 0 0 0 1.9 1l.3 2.6h4L15 18a7 7 0 0 0 1.5-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"></path></svg>
        </span>
        <span>Settings</span>
    </a>
</nav>
{% endwith %}
