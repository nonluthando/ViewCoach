<a class="dashboard-v3-metric dashboard-v3-accent-{{ accent }}" href="{{ href }}">
    <span class="dashboard-v3-metric-icon" aria-hidden="true">{{ icon }}</span>
    <span class="dashboard-v3-metric-copy">
        <strong>{{ value }}</strong>
        <span>{{ label }}</span>
        <small>{{ detail }}</small>
    </span>
</a>
